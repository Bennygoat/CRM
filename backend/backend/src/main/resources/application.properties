spring.application.name=demo
#spring.profiles.active=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/sample_0702
# Database account comes from .env / environment variables. Startup fails if they are not set
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect

# Secrets come from environment variables. Locally they can live in .env in the working directory (git-ignored; template: .env.example)
spring.config.import=optional:file:.env[.properties]
# JWT signing key: Base64, at least 32 bytes after decoding. Startup fails if JWT_SECRET is not set
jwt.secret=${JWT_SECRET}
# Initial password for the built-in admin account. If empty, no admin account is created
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}


# ECPay API settings (sandbox URLs). Merchant ID / HashKey / HashIV come from .env;
# if empty the app still starts, but payment and logistics calls will fail
ecpay.aio.url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5
ecpay.aio.merchant-id=${ECPAY_AIO_MERCHANT_ID:}
ecpay.aio.hash-key=${ECPAY_AIO_HASH_KEY:}
ecpay.aio.hash-iv=${ECPAY_AIO_HASH_IV:}
ecpay.aio.return-url=https://b654-114-38-45-229.ngrok-free.app/api/payments/ecpay/callback
ecpay.aio.client-back-url=http://localhost:5173/User

ecpay.logistics.url=https://logistics-stage.ecpay.com.tw
ecpay.logistics.merchant-id=${ECPAY_LOGISTICS_MERCHANT_ID:}
ecpay.logistics.hash-key=${ECPAY_LOGISTICS_HASH_KEY:}
ecpay.logistics.hash-iv=${ECPAY_LOGISTICS_HASH_IV:}
ecpay.logistics.sender-name=JoshK
ecpay.logistics.sender-phone=0226550115
ecpay.logistics.sender-cellphone=0912345678
ecpay.logistics.sender-zip-code=115
ecpay.logistics.sender-address=台中市西屯區西安街277巷13弄3號
ecpay.logistics.server-reply-url=https://b654-114-38-45-229.ngrok-free.app/api/logistics/store-reply
